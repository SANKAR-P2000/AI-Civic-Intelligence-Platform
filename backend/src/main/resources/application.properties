# ==============================
# Application
# ==============================
spring.application.name=backend

# Active profile: uses application-local.properties for real DB / email config
spring.profiles.active=local
# ==============================
# MySQL Database Configuration
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/aicip_db
spring.datasource.username=root
spring.datasource.password=admin@SANKAR2000
# ==============================
# JDBC Driver
# ==============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ==============================
# Server
# ==============================
server.port=8080
# ==========================
# JWT Configuration
# ==========================
jwt.secret=your_jwt_secret_key
jwt.expiration=86400000
# ==========================
# File Upload Configuration
# ==========================
file.upload-dir=uploads/complaint-images
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# ==========================
# Gmail SMTP Configuration
# ==========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ==========================================
# Logging Configuration
# ==========================================

# Root logging level
logging.level.root=INFO

# Application package logging
logging.level.com.sankar.aicip=DEBUG

# Spring Security logging
logging.level.org.springframework.security=INFO

# Hibernate SQL logging
logging.level.org.hibernate.SQL=DEBUG

# Hibernate parameter values
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Log file name
logging.file.name=logs/aicip.log

# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# Log file size
logging.logback.rollingpolicy.max-file-size=10MB

# Number of archived log files
logging.logback.rollingpolicy.max-history=30

# Total log archive size
logging.logback.rollingpolicy.total-size-cap=300MB

# Clean archive on startup
logging.logback.rollingpolicy.clean-history-on-start=false

spring.jpa.open-in-view=false